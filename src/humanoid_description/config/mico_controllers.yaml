# ros2_control for Mico (20 DoF) in Gazebo Harmonic via gz_ros2_control.
# Joint names match sim/mini_humanoid/gen_robot.py, humanoid.xml (MuJoCo) and mico.urdf.xacro.
controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

position_controller:
  ros__parameters:
    joints:
      - l_hip_yaw
      - l_hip_roll
      - l_hip_pitch
      - l_knee
      - l_ankle_pitch
      - l_ankle_roll
      - r_hip_yaw
      - r_hip_roll
      - r_hip_pitch
      - r_knee
      - r_ankle_pitch
      - r_ankle_roll
      - l_shoulder_pitch
      - l_shoulder_roll
      - l_elbow
      - r_shoulder_pitch
      - r_shoulder_roll
      - r_elbow
      - neck_yaw
      - head_pitch
